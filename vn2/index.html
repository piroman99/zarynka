<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<!-- бета: убирает адресную строку при запуске с иконки «На экран Домой» (iOS/Android) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Зарянка">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Зарянка — визуальная новелла</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="bg-a" class="bg"></div>
    <div id="bg-b" class="bg"></div>
    <div id="cast">
      <img class="sprite" data-slot="0" alt="">
      <img class="sprite" data-slot="1" alt="">
    </div>
    <div id="vignette"></div>

    <!-- Перебивка между сценами: акварельная «промокашка» на время смены фона.
         Нужна, чтобы смена кадра не выглядела рывком; текст и надписи не трогает. -->
    <div id="brk" aria-hidden="true"></div>

    <!-- тулбар: авто / тумблеры текст / голос / музыка -->
    <div id="tools">
      <button id="t-auto"  class="tg wide" title="Авто-режим (листается само)">Авто</button>
      <button id="t-pause" class="tg" title="Пауза / продолжить (P)" hidden>⏸</button>
      <button id="t-text"  class="tg" title="Текст (подстрочник)">Aa</button>
      <button id="t-voice" class="tg" title="Голос закадра">🎙</button>
      <button id="t-music" class="tg" title="Музыка">♪</button>
      <button id="t-full"  class="tg" title="Полный экран">⛶</button>
    </div>

    <!-- Титры -->
    <section id="title" class="screen show">
      <div class="title-inner">
        <img src="img/logo.png" alt="" class="logo">
        <h1 id="tt">ЗАРЯНКА</h1>
        <p class="sub">визуальная новелла</p>
        <p class="ep" id="tep"></p>
        <button id="start">Начать</button>
        <div id="pl" class="pl"><div id="plbar"></div></div>
        <p id="pltext" class="pltext"></p>
        <button id="teaser" class="ghost">▶ Тизер</button>
        <p class="by" id="byline"></p>
      </div>
    </section>

    <!-- Видео-узел: интро-значок -->
    <div id="vlayer" hidden>
      <video id="znak" playsinline preload="auto"></video>
      <button id="vskip">Пропустить ▸</button>
    </div>

    <!-- Навигация: назад / далее -->
    <div id="nav">
      <button id="prev" title="Назад (←)">‹</button>
      <button id="next" title="Далее (→)">›</button>
    </div>

    <!-- Диалог -->
    <div id="hud">
      <div id="chapter"></div>
      <div id="box">
        <div id="name"></div>
        <div id="text"></div>
        <div id="hint">▸ пробел / клик — далее · ← — назад</div>
      </div>
    </div>

    <!-- Конец серии -->
    <section id="end" class="screen">
      <div class="title-inner">
        <p class="endkicker">Конец первой серии</p>
        <h2 class="endttl">Ждите следующих серий</h2>
        <div class="endbtns">
          <button id="e-menu">В меню</button>
          <button id="e-teaser" class="ghost">▶ Тизер</button>
        </div>
        <p class="by" id="e-byline"></p>
      </div>
    </section>

    <!-- Кинозал (тизер/AVM) -->
    <div id="cinema" hidden>
      <video id="avm" playsinline preload="none"></video>
      <div id="chint">Разверните телефон — кадр станет больше</div>
      <button id="skip">Пропустить ▸</button>
    </div>
  </div>

  <div id="toast" role="status"></div>
  <audio id="music" loop preload="auto"></audio>
  <audio id="voice" preload="auto"></audio>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
