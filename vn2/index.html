<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Зарянка — визуальная новелла</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="bg-a" class="bg"></div>
    <div id="bg-b" class="bg"></div>
    <img id="sprite" alt="">
    <div id="vignette"></div>

    <!-- тулбар: тумблеры текст / голос / музыка -->
    <div id="tools">
      <button id="t-text"  class="tg" title="Текст (подстрочник)">Aa</button>
      <button id="t-voice" class="tg" title="Голос закадра">🎙</button>
      <button id="t-music" class="tg" title="Музыка">♪</button>
    </div>

    <!-- Титры -->
    <section id="title" class="screen show">
      <div class="title-inner">
        <img src="img/logo.png" alt="" class="logo">
        <h1 id="tt">ЗАРЯНКА</h1>
        <p class="sub">визуальная новелла</p>
        <p class="ep" id="tep"></p>
        <button id="start">Начать</button>
        <button id="teaser" class="ghost">▶ Тизер</button>
        <p class="by" id="byline"></p>
      </div>
    </section>

    <!-- Видео-узел: интро-значок -->
    <div id="vlayer" hidden>
      <video id="znak" playsinline preload="auto"></video>
      <button id="vskip">Пропустить ▸</button>
    </div>

    <!-- Диалог -->
    <div id="hud">
      <div id="chapter"></div>
      <div id="box">
        <div id="name"></div>
        <div id="text"></div>
        <div id="hint">▸ клик / пробел — далее</div>
      </div>
    </div>

    <!-- Кинозал (тизер/AVM) -->
    <div id="cinema" hidden>
      <video id="avm" playsinline preload="none"></video>
      <button id="skip">Пропустить ▸</button>
    </div>
  </div>

  <audio id="music" loop preload="auto"></audio>
  <audio id="voice" preload="auto"></audio>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
